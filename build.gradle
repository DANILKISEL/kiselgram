plugins {
    id 'java'
    id 'application'
}

group = 'com.kiselgram'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.4.0'
    implementation 'org.slf4j:slf4j-simple:2.0.13'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    implementation 'org.hibernate.orm:hibernate-core:6.6.1.Final'
    implementation 'org.postgresql:postgresql:42.7.4'

    implementation 'org.flywaydb:flyway-core:10.15.0'
    implementation 'org.flywaydb:flyway-database-postgresql:10.15.0'

    implementation 'io.github.cdimascio:dotenv-java:3.0.2'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.17.2'

    implementation 'nl.martijndwars:web-push:5.1.1'

    implementation 'org.eclipse.angus:jakarta.mail:2.0.3'

    implementation 'org.pac4j:javalin-pac4j:6.0.0'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.40'

    implementation 'com.github.lalyos:jfiglet:0.0.8'

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'

    implementation 'com.h2database:h2:2.2.224'

    implementation 'com.auth0:java-jwt:4.4.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
}

application {
    mainClass = 'ru.kiselgram.web.KiselgramApp'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.named('test') {
    useJUnitPlatform()
}

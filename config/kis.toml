[app]
name = "Kiselgram"
version = "1.0.0"
debug = false
host = "0.0.0.0"
port = 8080
secret_key = "change-me-in-production"

[database]
url = "jdbc:h2:file:./data/kiselgram;DB_CLOSE_ON_EXIT=FALSE"
echo = false

[server]
workers = 4
threaded = true

[video]
enabled = false
host = "127.0.0.1"
port = 5000
quality = 30
max_size = 52428800

[logging]
level = "INFO"
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
file = "logs/kiselgram.log"
max_size = 10485760
backup_count = 5

[telegram]
bot_token = ""
webhook_url = ""

[uploads]
folder = "uploads"
max_size = 104857600
allowed_images = ["jpg", "jpeg", "png", "gif", "bmp", "webp"]
allowed_documents = ["pdf", "doc", "docx", "txt", "rtf"]
allowed_videos = ["mp4", "avi", "mov", "mkv", "webm"]

[features]
groups = true
channels = true
bots = true
video_streaming = false
file_sharing = true
reactions = true

[mail]
server = "smtp.gmail.com"
port = 587
username = ""
password = ""
sender_name = "Kiselgram"
sender_email = "noreply@kiselgram.com"

[auth]
port = 8081

[google]
client_id = "YOUR_GOOGLE_CLIENT_ID"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
redirect_uri = "http://127.0.0.1:8080/oauth/google/callback"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Kiselgram</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { --bg: #0f0f1a; --card: #1a1a2e; --text: #e0e0e0; --muted: #888; --accent: #667eea; --border: #2a2a3e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    h1 { font-size: 24px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .section { margin-bottom: 32px; }
    .section h2 { font-size: 18px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
    th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: rgba(255,255,255,0.05); color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
    td { color: var(--text); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-pending { background: #f59e0b33; color: #f59e0b; }
    .badge-resolved { background: #10b98133; color: #10b981; }
    .btn { padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; background: var(--accent); color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-danger { background: #ef4444; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; background: transparent; color: var(--muted); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hidden { display: none; }
    #loading { text-align: center; padding: 40px; color: var(--muted); }
    select { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: var(--card); border-radius: 16px; padding: 32px; width: 320px; border: 1px solid var(--border); }
    .login-box h2 { margin-bottom: 20px; font-size: 20px; text-align: center; }
    .login-box input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; }
    .login-box input:focus { border-color: var(--accent); }
    .login-box .btn { width: 100%; padding: 10px; font-size: 15px; }
    .login-error { color: #ef4444; font-size: 13px; text-align: center; margin-top: 8px; display: none; }
    .user-info { display: flex; align-items: center; gap: 12px; margin-left: auto; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center">
    <h1><i class="fas fa-shield-alt"></i> Kiselgram Admin</h1>
    <div class="user-info" id="userInfo"></div>
  </div>

  <div id="adminContent"{% if not current_user or not current_user.is_admin %} class="hidden"{% endif %}>
    <div class="stats" id="stats"></div>

    <div class="tabs">
      <button class="tab active" data-tab="reports"><i class="fas fa-flag"></i> Reports</button>
      <button class="tab" data-tab="users"><i class="fas fa-users"></i> Users</button>
      <button class="tab" data-tab="twofa"><i class="fas fa-shield-alt"></i> 2FA</button>
    </div>

    <div id="reports-tab">
      <div class="section">
        <h2>Reports</h2>
        <select id="reportStatus">
          <option value="pending">Pending</option>
          <option value="resolved">Resolved</option>
        </select>
        <table><thead><tr><th>ID</th><th>Reporter</th><th>Reported User</th><th>Reason</th><th>Date</th><th>Actions</th></tr></thead><tbody id="reportsBody"></tbody></table>
      </div>
    </div>

    <div id="users-tab" class="hidden">
      <div class="section">
        <h2>Users</h2>
        <table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Admin</th><th>Created</th></tr></thead><tbody id="usersBody"></tbody></table>
      </div>
    </div>

    <div id="twofa-tab" class="hidden">
      <div class="stats" id="twofaStats"></div>
      <div class="section">
        <h2>OTP Codes</h2>
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-sm" onclick="loadTwofaOtps()"><i class="fas fa-sync-alt"></i> Refresh</button>
          <button class="btn btn-sm btn-danger" onclick="cleanupOtps()"><i class="fas fa-trash-alt"></i> Cleanup Expired/Used</button>
        </div>
        <table><thead><tr><th>ID</th><th>User</th><th>Code</th><th>Created</th><th>Expires</th><th>Status</th></tr></thead><tbody id="twofaBody"></tbody></table>
      </div>
    </div>
  </div>

  <div id="loading">Loading...</div>

  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2><i class="fas fa-shield-alt"></i> Admin Login</h2>
      <input type="text" id="loginUser" placeholder="Username" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn" onclick="doLogin()">Sign In</button>
      <div class="login-error" id="loginError">Invalid credentials</div>
    </div>
  </div>

  <script>
    const API = '/api/admin';

    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const d = await r.json();
      if (d.success) {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        document.getElementById('userInfo').innerHTML = '<span><i class="fas fa-user"></i> ' + esc(d.data.username) + '</span><button class="btn btn-sm" onclick="doLogout()">Logout</button>';
        document.getElementById('loading').style.display = '';
        Promise.all([loadDashboard(), loadReports()]).then(() => document.getElementById('loading').style.display = 'none');
      } else if (r.status === 401) {
        errEl.style.display = 'block';
      } else {
        errEl.textContent = 'Server error (' + r.status + ')';
        errEl.style.display = 'block';
      }
    }

    async function doLogout() {
      await fetch(API + '/logout', {method:'POST'});
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('adminContent').classList.add('hidden');
      document.getElementById('userInfo').innerHTML = '';
    }

    async function loadDashboard() {
      const d = await fetch(API + '/dashboard').then(r => r.json());
      if (!d.success) return;
      const s = d.data;
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-value">${s.total_users}</div><div class="stat-label">Total Users</div></div>
        <div class="stat"><div class="stat-value">${s.users_today}</div><div class="stat-label">Users Today</div></div>
        <div class="stat"><div class="stat-value">${s.total_reports}</div><div class="stat-label">Total Reports</div></div>
        <div class="stat"><div class="stat-value">${s.pending_reports}</div><div class="stat-label">Pending Reports</div></div>
      `;
    }

    async function loadReports(status = 'pending') {
      const d = await fetch(API + '/reports?status=' + status).then(r => r.json());
      if (!d.success) return;
      const rows = (d.data?.reports || []).map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${esc(r.reporter_username || r.reporter_id)}</td>
          <td>${esc(r.reported_username || r.reported_user_id || '-')}</td>
          <td>${esc(r.reason||'').substring(0,60)}</td>
          <td>${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</td>
          <td>${status === 'pending' ? `<button class="btn btn-sm" onclick="resolveReport(${r.id})">Resolve</button>` : ''}</td>
        </tr>
      `).join('');
      document.getElementById('reportsBody').innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No reports</td></tr>';
    }

    async function resolveReport(id) {
      const d = await fetch(API + '/reports/' + id + '/resolve', { method: 'POST' }).then(r => r.json());
      if (d.success) { loadReports(document.getElementById('reportStatus').value); }
    }

    async function loadUsers() {
      const d = await fetch(API + '/users').then(r => r.json());
      if (!d.success) return;
      const rows = (d.data?.users || []).map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${esc(u.username)}</td>
          <td>${esc(u.email||'-')}</td>
          <td>${u.is_admin ? '<span class="badge badge-resolved">Yes</span>' : 'No'}</td>
          <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : ''}</td>
        </tr>
      `).join('');
      document.getElementById('usersBody').innerHTML = rows || '<tr><td colspan="5" style="text-align:center;color:var(--muted)">No users</td></tr>';
    }

    function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    document.getElementById('reportStatus').addEventListener('change', function() { loadReports(this.value); });

    async function loadTwofaOverview() {
      const d = await fetch(API + '/2fa/overview').then(r => r.json());
      if (!d.success) return;
      const s = d.data;
      document.getElementById('twofaStats').innerHTML = `
        <div class="stat"><div class="stat-value">${s.total}</div><div class="stat-label">Total OTPs</div></div>
        <div class="stat"><div class="stat-value">${s.active}</div><div class="stat-label">Active</div></div>
        <div class="stat"><div class="stat-value" style="color:#f59e0b">${s.expired}</div><div class="stat-label">Expired</div></div>
        <div class="stat"><div class="stat-value" style="color:#10b981">${s.used}</div><div class="stat-label">Used</div></div>
        <div class="stat"><div class="stat-value">${s.sent_today}</div><div class="stat-label">Sent Today</div></div>
      `;
    }

    async function loadTwofaOtps() {
      const d = await fetch(API + '/2fa/otps?per_page=50').then(r => r.json());
      if (!d.success) return;
      const rows = (d.data?.otps || []).map(o => {
        const status = o.used ? '<span class="badge badge-resolved">Used</span>'
                     : o.expired ? '<span class="badge badge-pending">Expired</span>'
                     : '<span class="badge" style="background:#667eea33;color:#667eea">Active</span>';
        return `<tr>
          <td>${o.id}</td>
          <td>${esc(o.username||'User #'+o.user_id)}</td>
          <td style="font-family:monospace;letter-spacing:1px">${esc(o.code)}</td>
          <td>${o.created_at ? new Date(o.created_at).toLocaleString() : '-'}</td>
          <td>${o.expires_at ? new Date(o.expires_at).toLocaleString() : '-'}</td>
          <td>${status}</td>
        </tr>`;
      }).join('');
      document.getElementById('twofaBody').innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No OTPs</td></tr>';
    }

    async function cleanupOtps() {
      if (!confirm('Delete all expired and used OTP codes?')) return;
      const d = await fetch(API + '/2fa/cleanup', {method:'POST'}).then(r => r.json());
      if (d.success) {
        alert('Deleted ' + d.data.deleted + ' OTP codes');
        loadTwofaOverview();
        loadTwofaOtps();
      } else {
        alert('Cleanup failed');
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('[id$="-tab"]').forEach(t => t.classList.add('hidden'));
        document.getElementById(this.dataset.tab + '-tab').classList.remove('hidden');
        if (this.dataset.tab === 'users') loadUsers();
        if (this.dataset.tab === 'twofa') { loadTwofaOverview(); loadTwofaOtps(); }
      });
    });

    {% if current_user and current_user.is_admin %}
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      document.getElementById('userInfo').innerHTML = '<span><i class="fas fa-user"></i> {{ current_user.username }}</span><button class="btn btn-sm" onclick="doLogout()">Logout</button>';
      Promise.all([loadDashboard(), loadReports()]).then(() => document.getElementById('loading').style.display = 'none');
    {% else %}
      document.getElementById('loading').style.display = 'none';
    {% endif %}
  </script>
</body>
</html>

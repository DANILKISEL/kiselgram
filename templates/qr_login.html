<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
  <title>QR Login - Kiselgram</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e2e; color: #f1f5f9;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px;
    }
    .card {
      background: #2e2e3e; border-radius: 16px; padding: 40px 32px;
      max-width: 400px; width: 100%; text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .spinner {
      width: 48px; height: 48px; margin: 24px auto;
      border: 4px solid #3e3e4e; border-top-color: #4A90D9;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon { font-size: 48px; margin: 16px 0; }
    h2 { margin-bottom: 8px; }
    p { color: #a0a0b0; line-height: 1.5; }
    .btn {
      display: inline-block; margin-top: 24px; padding: 12px 32px;
      background: #4A90D9; color: #fff; border: none; border-radius: 8px;
      font-size: 16px; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: #3a7bc8; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="spinner"></div>
    <h2>Confirming login...</h2>
    <p>Please wait while we verify your identity</p>
  </div>

  <script>
    (async function() {
      const token = '{{ token }}';
      const app = document.getElementById('app');

      try {
        const res = await fetch('/api.v2/api/auth/qr/claim/' + token, { method: 'POST' });
        const data = await res.json();

        if (data.success) {
          app.innerHTML = '<div class="icon success">&#10003;</div><h2>Login confirmed!</h2><p>You can close this page and return to the desktop app.</p>';
        } else {
          const msg = data.error?.message || 'Unknown error';
          if (data.error?.code === 'UNAUTHORIZED') {
            app.innerHTML = '<div class="icon error">&#9888;</div><h2>Not logged in</h2><p>Please log in to Kiselgram in this browser first, then scan the QR code again.</p><a class="btn" href="/auth/login">Log in</a>';
          } else {
            app.innerHTML = '<div class="icon error">&#10007;</div><h2>Failed</h2><p>' + msg + '</p>';
          }
        }
      } catch (e) {
        app.innerHTML = '<div class="icon error">&#10007;</div><h2>Connection error</h2><p>Could not reach the server. Please try again.</p>';
      }
    })();
  </script>
</body>
</html>

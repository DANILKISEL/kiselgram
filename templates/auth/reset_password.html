<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Kiselgram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1a2e; border-radius: 16px; padding: 32px; width: 360px; border: 1px solid #2a2a3e; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #2a2a3e; background: #0f0f1a; color: #e0e0e0; font-size: 14px; margin-bottom: 12px; }
    button { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #667eea; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .flash { background: #f59e0b33; color: #f59e0b; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
    a { color: #667eea; text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <input type="password" name="password" placeholder="New password (min 6 chars)" required minlength="6">
      <input type="password" name="confirm" placeholder="Confirm new password" required minlength="6">
      <button type="submit">Reset Password</button>
    </form>
    <div style="text-align:center;margin-top:16px"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
  </div>
</body>
</html>

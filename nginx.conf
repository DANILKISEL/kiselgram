upstream app {
    server app:5000;
}

upstream video {
    server video:5001;
}

upstream mailadmin {
    server mailadmin:5002;
}

# HTTP — web subdomain
server {
    listen 80;
    server_name web.kiselgram.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTP — bare domain → redirect to its own HTTPS
server {
    listen 80;
    server_name kiselgram.ru www.kiselgram.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kiselgram.ru$request_uri;
    }
}


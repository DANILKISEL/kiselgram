# ─── Development (H2) ───
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:file:./data/kiselgram;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.format_sql=true
hibernate.highlight_sql=true

# Connection pool
hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.timeout=300
hibernate.c3p0.max_statements=50
hibernate.c3p0.idle_test_period=3000

# ─── Production (PostgreSQL) ───
# Uncomment and configure for production:
# hibernate.connection.driver_class=org.postgresql.Driver
# hibernate.connection.url=jdbc:postgresql://localhost:5432/kiselgram
# hibernate.connection.username=kiselgram
# hibernate.connection.password=your-password
# hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# hibernate.hbm2ddl.auto=validate
# hibernate.show_sql=false
# hibernate.format_sql=false


name: CD

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kiselgram-app

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          IMAGE=${IMAGE}
          RELEASE=${GITHUB_REF_NAME#v}
          if [ -n "$RELEASE" ] && [ "$RELEASE" != "main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${RELEASE},${IMAGE}:$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:$(date +%Y%m%d-%H%M%S),${IMAGE}:$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tarball
        if: github.event_name == 'release'
        run: |
          docker pull ${IMAGE}:latest && docker save ${IMAGE}:latest | gzip > kiselgram-app.tar.gz

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: kiselgram-app.tar.gz

  deploy:
    name: Deploy to server
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync repo to server
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            --exclude '.git' --exclude 'uploads' --exclude 'instance' --exclude 'logs' \
            --exclude '.venv' --exclude 'config/kis.toml' \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/root/kiselgram/

      - name: Pull image and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            cd /root/kiselgram &&
            docker pull ghcr.io/${{ github.repository_owner }}/kiselgram-app:latest &&
            docker compose up -d --no-deps --build app video &&
            docker image prune -f >/dev/null
          "

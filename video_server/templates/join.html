<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiselgram Video</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:40px;max-width:420px;width:100%;text-align:center}
.card h1{font-size:1.8rem;margin-bottom:6px}
.card p{color:rgba(255,255,255,.5);margin-bottom:28px;font-size:.95rem}
.fg{margin-bottom:18px;text-align:left}
.fg label{display:block;font-size:.85rem;margin-bottom:6px;color:rgba(255,255,255,.6)}
.fg input{width:100%;padding:14px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:1rem;outline:none;transition:border-color .2s}
.fg input:focus{border-color:#667eea}
.fg input::placeholder{color:rgba(255,255,255,.25)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:600;font-size:1rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:#667eea;color:#fff}
.btn-primary:hover{background:#5a6fd6}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#28a745;color:#fff;padding:10px 22px;border-radius:50px;font-size:.9rem;z-index:9999;animation:sd .3s}
.toast.error{background:#dc3545}
@keyframes sd{from{opacity:0;transform:translateX(-50%)translateY(-20px)}to{opacity:1;transform:translateX(-50%)translateY(0)}}
</style>
</head>
<body>
<div class="card">
  <h1><i class="fas fa-phone-alt"></i> Call</h1>
  <p>Start a new call or join an existing one</p>
  <div class="fg"><label>Your name</label><input type="text" id="un" placeholder="Enter your name" maxlength="200"></div>
  <div class="fg"><label>Room ID (leave empty to create new)</label><input type="text" id="rid" placeholder="e.g. a1b2c3d4"></div>
  <button onclick="go()" id="btn" class="btn btn-primary"><i class="fas fa-plus"></i> Create Room</button>
  <div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)"><p style="font-size:.85rem;color:rgba(255,255,255,.4)">Quick join — paste a room ID above</p></div>
</div>
<script>
const p=new URLSearchParams(location.search);
if(p.get('username'))$('un').value=p.get('username');
if(p.get('room')){$('rid').value=p.get('room');$('btn').innerHTML='<i class="fas fa-sign-in-alt"></i> Join Room'}
function $(x){return document.getElementById(x)}
function t(m,tp){const d=document.createElement('div');d.className='toast'+(tp==='error'?' error':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
async function go(){
  const un=$('un').value.trim(),rid=$('rid').value.trim(),b=$('btn');
  if(!un){t('Please enter your name','error');return}
  if(rid){
    try{const r=await fetch('/api/rooms/'+rid);if(r.ok){location.href='/room/'+rid+'?username='+encodeURIComponent(un);return}}catch(e){}
    t('Room not found. Check the ID or create a new room.','error');return
  }
  b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin"></i> Creating...';
  try{
    const r=await fetch('/api/rooms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:un,name:un+"'s Room"})});
    const d=await r.json();
    if(d.success){location.href='/room/'+d.room_id+'?username='+encodeURIComponent(un)}
    else{t('Failed to create room','error');b.disabled=false;b.innerHTML='<i class="fas fa-plus"></i> Create Room'}
  }catch(e){t('Connection error','error');b.disabled=false;b.innerHTML='<i class="fas fa-plus"></i> Create Room'}
}
$('un').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('rid').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script>
</body>
</html>

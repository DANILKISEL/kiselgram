<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Admin — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.login-box { background: #16213e; padding: 40px; border-radius: 12px; width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.4); }
h1 { text-align: center; margin-bottom: 4px; font-weight: 600; color: #e94560; font-size: 22px; }
p.sub { text-align: center; color: #888; margin-bottom: 24px; font-size: 13px; }
label { display: block; margin-bottom: 4px; color: #aaa; font-size: 13px; }
input[type=email], input[type=password] { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #0f3460; color: #eee; font-size: 15px; outline: none; margin-bottom: 14px; }
input:focus { border-color: #e94560; }
button { width: 100%; padding: 12px; background: #e94560; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
button:hover { background: #d63851; }
.error { background: rgba(233,69,96,.15); color: #e94560; padding: 10px; border-radius: 8px; text-align: center; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="login-box">
<h1>Mail Admin</h1>
<p class="sub">kiselgram.ru mail server</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post">
<label for="email">Email</label>
<input type="email" name="email" id="email" required autofocus placeholder="user@kiselgram.ru">
<label for="password">Password</label>
<input type="password" name="password" id="password" required>
<button type="submit">Sign in</button>
</form>
</div>
</body>
</html>

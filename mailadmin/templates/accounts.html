<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Admin — Accounts</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; padding: 24px; }
.container { max-width: 900px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
h1 { font-size: 22px; color: #e94560; }
h1 small { font-weight: 400; font-size: 13px; color: #888; display: block; margin-top: 2px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
.badge-admin { background: #e94560; color: #fff; }
.badge-user { background: #555; color: #ccc; }
.btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #d63851; }
.btn-danger { background: #c0392b; color: #fff; }
.btn-danger:hover { background: #a93226; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
.btn-outline:hover { border-color: #888; color: #fff; }
a.btn { text-decoration: none; }
.card { background: #16213e; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #e94560; }
.card p { font-size: 14px; color: #ccc; margin-bottom: 8px; }
.card label { display: block; margin-bottom: 4px; color: #aaa; font-size: 13px; }
.card input[type=email], .card input[type=password] { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; background: #0f3460; color: #eee; font-size: 14px; outline: none; margin-bottom: 12px; }
.card input:focus { border-color: #e94560; }
.card-actions { display: flex; gap: 8px; margin-top: 8px; }
table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 12px; overflow: hidden; }
th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #0f3460; }
th { background: #0f3460; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
tr:last-child td { border-bottom: none; }
td { font-size: 14px; font-family: 'SF Mono', 'Fira Code', monospace; }
td.actions { white-space: nowrap; }
td.actions button { margin-left: 6px; }
.empty { text-align: center; padding: 40px; color: #666; }
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 1000; display: none; }
.toast.success { background: #27ae60; }
.toast.error { background: #e74c3c; }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.6); justify-content: center; align-items: center; z-index: 999; }
.modal-overlay.active { display: flex; }
.modal { background: #16213e; padding: 28px; border-radius: 12px; width: 400px; max-width: 90vw; }
.modal h2 { font-size: 18px; margin-bottom: 16px; color: #eee; }
.modal label { display: block; margin-bottom: 4px; color: #aaa; font-size: 13px; }
.modal input[type=text], .modal input[type=password], .modal select { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 8px; background: #0f3460; color: #eee; font-size: 14px; outline: none; margin-bottom: 12px; }
.modal input:focus, .modal select:focus { border-color: #e94560; }
.modal select { appearance: none; cursor: pointer; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
.modal-actions .btn { min-width: 80px; text-align: center; }
.btn-secondary { background: #555; color: #fff; }
.btn-secondary:hover { background: #666; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Mail Admin <small>{{ email }} <span class="badge badge-{{ 'admin' if is_admin else 'user' }}">{{ 'admin' if is_admin else 'user' }}</span></small></h1>
<div><a href="/mailadmin/logout" class="btn btn-outline">Logout</a></div>
</div>

{% if is_admin %}
<div style="margin-bottom:16px"><button class="btn btn-primary" onclick="showAddModal()">+ Add account</button></div>

<div class="card" style="padding:0;overflow:hidden">
<table>
<thead><tr><th>Email</th><th>Actions</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
{% endif %}

<div class="card">
<h2>My Account</h2>
<p>Logged in as <strong id="myEmail">{{ email }}</strong></p>
<div style="margin-top:20px;border-top:1px solid #0f3460;padding-top:16px">
<h3 style="font-size:14px;color:#aaa;margin-bottom:12px">Change password</h3>
<label>Current password</label>
<input type="password" id="curPass" placeholder="Enter current password">
<label>New password</label>
<input type="password" id="newPass" placeholder="Min 6 characters">
<div class="card-actions">
<button class="btn btn-primary btn-sm" onclick="changeMyPass()">Change password</button>
</div>
</div>
<div style="margin-top:16px;border-top:1px solid #0f3460;padding-top:16px">
<h3 style="font-size:14px;color:#aaa;margin-bottom:12px">Change email</h3>
<label>New email</label>
<select id="newEmailDomain">
{% for d in domains %}
<option value="{{ d }}">@{{ d }}</option>
{% endfor %}
</select>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
<input type="text" id="newEmailLocal" placeholder="local-part" style="width:auto;flex:1;padding:10px;border:1px solid #333;border-radius:8px;background:#0f3460;color:#eee;font-size:14px;outline:none">
<span style="color:#888">@</span>
<select id="newEmailDomain2" style="width:auto;flex:1;padding:10px;border:1px solid #333;border-radius:8px;background:#0f3460;color:#eee;font-size:14px;outline:none;cursor:pointer">
{% for d in domains %}
<option value="{{ d }}">@{{ d }}</option>
{% endfor %}
</select>
</div>
<label>Current password (confirm)</label>
<input type="password" id="changeEmailPass" placeholder="Enter current password">
<div class="card-actions">
<button class="btn btn-primary btn-sm" onclick="changeMyEmail()">Change email</button>
</div>
</div>
</div>
</div>

<div class="modal-overlay" id="addModal">
<div class="modal">
<h2>Add mail account</h2>
<label>Email</label>
<div style="display:flex;gap:8px;align-items:center">
<input type="text" id="addLocal" placeholder="local-part" style="width:auto;flex:1;padding:10px;border:1px solid #333;border-radius:8px;background:#0f3460;color:#eee;font-size:14px;outline:none">
<span style="color:#888">@</span>
<select id="addDomain" style="width:auto;flex:1;padding:10px;border:1px solid #333;border-radius:8px;background:#0f3460;color:#eee;font-size:14px;outline:none;cursor:pointer">
{% for d in domains %}
<option value="{{ d }}">{{ d }}</option>
{% endfor %}
</select>
</div>
<label>Password</label>
<input type="password" id="addPassword" placeholder="min 6 characters">
<div class="modal-actions">
<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
<button class="btn btn-primary" onclick="addAccount()">Add</button>
</div>
</div>
</div>

<div class="modal-overlay" id="passModal">
<div class="modal">
<h2>Reset password</h2>
<p id="passEmailDisplay" style="color:#888;margin-bottom:12px;font-size:13px"></p>
<label>New password</label>
<input type="password" id="passPassword" placeholder="min 6 characters">
<div class="modal-actions">
<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
<button class="btn btn-primary" onclick="adminResetPass()">Save</button>
</div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
let accounts = [];
let targetEmail = null;
const isAdmin = {{ 'true' if is_admin else 'false' }};

async function fetchAccounts() {
if (!isAdmin) return;
const res = await fetch('/mailadmin/api/accounts');
const data = await res.json();
if (data.success) { accounts = data.accounts; render(); }
}

function render() {
const tbody = document.getElementById('tbody');
if (!accounts.length) {
tbody.innerHTML = '<tr><td colspan="2" class="empty">No mail accounts yet</td></tr>';
return;
}
tbody.innerHTML = accounts.map(a => `<tr><td>${esc(a.email)}</td><td class="actions">
<button class="btn btn-primary btn-sm" onclick="showPassModal('${esc(a.email)}')">Password</button>
<button class="btn btn-danger btn-sm" onclick="deleteAccount('${esc(a.email)}')">Delete</button>
</td></tr>`).join('');
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type) {
const el = document.getElementById('toast');
el.textContent = msg;
el.className = 'toast ' + type;
el.style.display = 'block';
setTimeout(() => el.style.display = 'none', 3000);
}

function showAddModal() {
targetEmail = null;
document.getElementById('addLocal').value = '';
document.getElementById('addPassword').value = '';
document.getElementById('addModal').classList.add('active');
document.getElementById('addLocal').focus();
}

function showPassModal(email) {
targetEmail = email;
document.getElementById('passEmailDisplay').textContent = email;
document.getElementById('passPassword').value = '';
document.getElementById('passModal').classList.add('active');
document.getElementById('passPassword').focus();
}

function hideModal() {
document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

async function addAccount() {
const local = document.getElementById('addLocal').value.trim();
const domain = document.getElementById('addDomain').value;
const password = document.getElementById('addPassword').value;
const email = local + '@' + domain;
if (!local || !password) return toast('Fill all fields', 'error');
const res = await fetch('/mailadmin/api/accounts', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, password})});
const data = await res.json();
if (data.success) { toast('Account created', 'success'); hideModal(); fetchAccounts(); }
else { toast(data.error || 'Failed', 'error'); }
}

async function deleteAccount(email) {
if (!confirm('Delete ' + email + '?')) return;
const res = await fetch('/mailadmin/api/accounts/' + encodeURIComponent(email), {method:'DELETE'});
const data = await res.json();
if (data.success) { toast('Account deleted', 'success'); fetchAccounts(); }
else { toast(data.error || 'Failed', 'error'); }
}

async function adminResetPass() {
const password = document.getElementById('passPassword').value;
if (!password || password.length < 6) return toast('Minimum 6 characters', 'error');
const res = await fetch('/mailadmin/api/accounts/' + encodeURIComponent(targetEmail) + '/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password})});
const data = await res.json();
if (data.success) { toast('Password updated', 'success'); hideModal(); }
else { toast(data.error || 'Failed', 'error'); }
}

async function changeMyPass() {
const cur = document.getElementById('curPass').value;
const newp = document.getElementById('newPass').value;
if (!cur || !newp) return toast('Fill all fields', 'error');
if (newp.length < 6) return toast('Minimum 6 characters', 'error');
const res = await fetch('/mailadmin/api/me/password', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({current_password: cur, new_password: newp})});
const data = await res.json();
if (data.success) { toast('Password changed', 'success'); document.getElementById('curPass').value = ''; document.getElementById('newPass').value = ''; }
else { toast(data.error || 'Failed', 'error'); }
}

async function changeMyEmail() {
const local = document.getElementById('newEmailLocal').value.trim();
const domain = document.getElementById('newEmailDomain2').value;
const password = document.getElementById('changeEmailPass').value;
const newEmail = local + '@' + domain;
if (!local || !password) return toast('Fill all fields', 'error');
const res = await fetch('/mailadmin/api/me/email', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({new_email: newEmail, password})});
const data = await res.json();
if (data.success) {
toast('Email changed to ' + newEmail, 'success');
document.getElementById('myEmail').textContent = newEmail;
document.getElementById('newEmailLocal').value = '';
document.getElementById('changeEmailPass').value = '';
if (isAdmin) fetchAccounts();
} else { toast(data.error || 'Failed', 'error'); }
}

fetchAccounts();

document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', function(e) { if (e.target === this) hideModal(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideModal(); });
</script>
</body>
</html>

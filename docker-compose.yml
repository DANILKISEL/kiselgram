services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: kiselgram
      POSTGRES_USER: kiselgram_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiselgram_user -d kiselgram"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  app:
    image: kiselgram-app:latest
    command: gunicorn wsgi:app -b 0.0.0.0:5000 --workers 4 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - uploads:/app/uploads
      - instance:/app/instance
      - ./config/kis.toml:/app/config/kis.toml:ro
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - VIDEO_HOST=video
      - VIDEO_PORT=5001
      - VIDEO_EXTERNAL_URL=https://web.kiselgram.ru
      - MAILADMIN_INTERNAL_KEY=${MAILADMIN_INTERNAL_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    security_opt:
      - no-new-privileges:true

  video:
    image: kiselgram-app:latest
    command: python video_server/app.py
    volumes:
      - ./config/kis.toml:/app/config/kis.toml:ro
    environment:
      - VIDEO_PORT=5001
      - VIDEO_HOST=0.0.0.0
      - VIDEO_PRODUCTION=1
      - DATABASE_URL=${DATABASE_URL}
      - VIDEO_EXTERNAL_URL=https://web.kiselgram.ru
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    restart: always
    security_opt:
      - no-new-privileges:true

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:14.0
    hostname: mail.kiselgram.ru
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    volumes:
      - maildata:/var/mail
      - mailstate:/var/mail-state
      - ./mailserver/config:/tmp/docker-mailserver
      - ./ssl/mail:/etc/ssl/mail:ro
    env_file: ./mailserver/mailserver.env
    restart: always

  mailadmin:
    image: kiselgram-mailadmin:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./mailserver/config:/mailconfig:rw
    environment:
      MAILADMIN_SECRET: "${MAILADMIN_SECRET}"
      MAILADMIN_ADMINS: "${MAILADMIN_ADMINS:-postmaster@kiselgram.ru,postmaster@mail.kiselgram.ru}"
      MAILADMIN_DOMAINS: "${MAILADMIN_DOMAINS:-kiselgram.ru,mail.kiselgram.ru}"
      MAILADMIN_INTERNAL_KEY: "${MAILADMIN_INTERNAL_KEY}"
    restart: always
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot
      - ./docs:/var/www/docs:ro
      - ./desktop-site:/var/www/desktop:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - app
      - video
      - mailadmin
    restart: always
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  instance:
  maildata:
  mailstate:
